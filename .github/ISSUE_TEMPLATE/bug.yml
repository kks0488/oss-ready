name: Bug report
description: Report incorrect or unexpected behavior
body:
  - type: markdown
    attributes:
      value: Do not paste credentials, private repository contents, or an unredacted private report.
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OSS Ready version
    validations:
      required: true

