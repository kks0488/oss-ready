[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-ready"
version = "0.1.0"
description = "Privacy-first OSS readiness auditing for local and SSH-hosted Git repositories"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "kks0488" }]
keywords = ["open-source", "git", "audit", "maintainer", "github"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.scripts]
oss-ready = "oss_ready.cli:main"

[project.urls]
Homepage = "https://github.com/kks0488/oss-ready"
Issues = "https://github.com/kks0488/oss-ready/issues"

[tool.setuptools.packages.find]
where = ["src"]

